<!DOCTYPE html>
<html>
  <head>
    <title>Users</title>
  </head>

  <body>
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Address</th>
        </tr>
      </thead>

      <tbody id="Table"></tbody>
    </table>

    <script>
      fetch("https://jsonplaceholder.typicode.com/users")
        .then((response) => response.json())
        .then((users) => {
          const table = document.getElementById("Table");

          users.forEach((user) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>
                            ${user.address.street},
                            ${user.address.suite},
                            ${user.address.city},
                            ${user.address.zipcode}
                        </td>
                    `;

            table.appendChild(row);
          });
        })
        .catch((error) => {
          console.log("error:", error);
        });
    </script>
  </body>
</html>

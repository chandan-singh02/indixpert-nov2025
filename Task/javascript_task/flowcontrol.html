<!DOCTYPE html>
<html>
  <head>
    <title>FizzBuzz</title>
  </head>
  <body>
    <h2>FizzBuzz Output</h2>
    <div id="output"></div>

    <script>
      let start = parseInt(prompt("Enter the starting number:"));
      let end = parseInt(prompt("Enter the ending number:"));

      let result = "";

      for (let i = start; i <= end; i++) {
        if (i % 3 === 0 && i % 5 === 0) {
          result += "FizzBuzz<br>";
        } else if (i % 3 === 0) {
          result += "Fizz<br>";
        } else if (i % 5 === 0) {
          result += "Buzz<br>";
        } else {
          result += i + "<br>";
        }
      }

      document.getElementById("output").innerHTML = result;
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Responsive Navbar</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      .navbar {
        height: 70px;
        background-color: #222;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 40px;
      }

      .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 30px;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }

      .nav-links a:hover {
        color: orange;
      }

      .hamburger {
        display: none;
        color: white;
        font-size: 30px;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .navbar {
          padding: 0 20px;
        }

        .hamburger {
          display: block;
        }

        .nav-links {
          display: none;

          position: absolute;
          top: 70px;
          left: 0;

          width: 100%;

          background-color: #222;

          flex-direction: column;
          align-items: center;

          gap: 0;
        }

        .nav-links.active {
          display: flex;
        }

        .nav-links li {
          width: 100%;
          text-align: center;
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">MyWebsite</div>

      <div
        class="hamburger"
        id="hamburger"
      >
        H===
      </div>

      <ul
        class="nav-links"
        id="navLinks"
      >
        <li>
          <a href="#">Home</a>
        </li>

        <li>
          <a href="#">About</a>
        </li>

        <li>
          <a href="#">Projects</a>
        </li>

        <li>
          <a href="#">Contact</a>
        </li>
      </ul>
    </nav>

    <script>
      const hamburger = document.getElementById("hamburger");

      const navLinks = document.getElementById("navLinks");

      hamburger.addEventListener("click", function () {
        navLinks.classList.toggle("active");
      });
    </script>
  </body>
</html>

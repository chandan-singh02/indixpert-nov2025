<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Grid Layout</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
      }

      .container {
        width: 650px;
        background: white;
        padding: 5px;

        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(6, 90px);
        gap: 5px;
      }

      .box {
        border: 2px solid #222;
        background: #eee;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 28px;
        font-family: Arial;
      }

      .box1 {
        grid-row: 1 / 3;
      }

      .box2 {
        grid-column: 2 / 4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">1</div>
      <div class="box box2">2</div>
      <!-- <div class="box box3">3</div> -->
    </div>
  </body>
</html>
